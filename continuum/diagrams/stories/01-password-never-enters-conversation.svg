<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" viewBox="0 0 1536 1024" font-family="Inter, 'Segoe UI', Arial, sans-serif">
<title>The password never enters the conversation</title>
<desc>Local provisioning seals passwords into the developer's vault. Claude Code requests available connections and receives alpha and beta with non-secret metadata, never credentials.</desc>
<defs>
<marker id="blue" orient="auto" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="12" refY="6"><path d="M 0 0 L 12 6 L 0 12 Z" fill="#2879C8"/></marker>
<marker id="green" orient="auto" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="12" refY="6"><path d="M 0 0 L 12 6 L 0 12 Z" fill="#318447"/></marker>
<marker id="orange" orient="auto" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="12" refY="6"><path d="M 0 0 L 12 6 L 0 12 Z" fill="#E87830"/></marker>
<marker id="purple" orient="auto" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="14" refY="7"><path d="M 0 0 L 14 7 L 0 14 Z" fill="#6540BC"/></marker>
<marker id="gold" orient="auto" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="12" refY="6"><path d="M 0 0 L 12 6 L 0 12 Z" fill="#A77923"/></marker>
</defs>
<rect x="0" y="0" width="1536" height="1024" fill="#FFFFFF"/>
<text x="36" y="66" font-size="44" font-weight="750" fill="#092039">The password never enters the conversation</text>
<text x="38" y="111" font-size="29" fill="#485567">Scene 1 · Before asking why order 42 is delayed</text>

<g class="domain" data-label="Developer's Windows machine" data-grade="declared">
<rect x="24" y="308" width="1000" height="690" rx="12" fill="#EFF8FF" stroke="#85B9E7" stroke-width="2"/>
<text x="52" y="350" font-size="28" font-weight="700" fill="#123B62">Developer's Windows machine</text>
<text x="52" y="379" font-size="18" fill="#52697E">Provisioning and credential storage stay local</text>

<g class="service" data-label="LocalMCPServer · provisioning console" data-grade="declared">
<rect x="360" y="416" width="580" height="110" rx="11" fill="#E6F3FF" stroke="#75AADE" stroke-width="2"/>
<path d="M 383 444 L 395 456 L 383 468 M 401 470 L 416 470" fill="none" stroke="#183C60" stroke-width="4" stroke-linecap="round"/>
<text x="436" y="451" font-size="23" font-weight="700" fill="#102C49"><tspan x="436">LocalMCPServer · provisioning console</tspan></text>
<text x="436" y="484" font-size="19" fill="#4E6175"><tspan x="436">Local interactive command, not an MCP tool</tspan></text>
</g>

<g class="service" data-label="CredentialVault" data-grade="declared">
<rect x="65" y="650" width="390" height="190" rx="12" fill="#E7F5E5" stroke="#5B9E59" stroke-width="2"/>
<text x="88" y="689" font-size="27" font-weight="700" fill="#17472B">CredentialVault</text>
<text x="88" y="725" font-size="20" fill="#324E42"><tspan x="88">Passwords sealed with DPAPI ·</tspan><tspan x="88" dy="26">current user only</tspan></text>
<text x="88" y="793" font-size="17" fill="#245435"><tspan x="88">Provisioned here by the developer;</tspan><tspan x="88" dy="24">services only read</tspan></text>
</g>

<g class="service" data-label="ConnectionRegistry" data-grade="declared">
<rect x="600" y="650" width="370" height="130" rx="12" fill="#F0E5F3" stroke="#B58ABC" stroke-width="2"/>
<text x="624" y="694" font-size="26" font-weight="700" fill="#382347">ConnectionRegistry</text>
<text x="624" y="730" font-size="19" fill="#596074"><tspan x="624">LocalMCPServer's connection</tspan><tspan x="624" dy="25">manager</tspan></text>
</g>

<g class="service" data-label="ConnectionCatalog" data-grade="declared">
<rect x="600" y="872" width="370" height="104" rx="12" fill="#FFF5DB" stroke="#D6AA4D" stroke-width="2"/>
<text x="620" y="904" font-size="25" font-weight="700" fill="#533D13">ConnectionCatalog</text>
<text x="620" y="933" font-size="18" fill="#65583E"><tspan x="620">Aliases, server, database and</tspan><tspan x="620" dy="24">approved scope · no secrets</tspan></text>
</g>
<text x="64" y="914" font-size="18" fill="#526276"><tspan x="64">Later: local services read credentials</tspan><tspan x="64" dy="26">when needed; passwords still never</tspan><tspan x="64" dy="26">enter chat.</tspan></text>
</g>

<g class="domain" data-label="Cloud conversation" data-grade="declared">
<rect x="1090" y="160" width="422" height="838" rx="12" fill="#F0FAF4" stroke="#82BFA0" stroke-width="2"/>
<text x="1116" y="204" font-size="28" font-weight="700" fill="#165D35">Cloud conversation</text>
<text x="1116" y="237" font-size="17" fill="#4D7460"><tspan x="1116">Names cross this boundary,</tspan><tspan x="1116" dy="24">not passwords</tspan></text>
<g class="service" data-label="Claude Code" data-grade="declared">
<rect x="1126" y="300" width="350" height="140" rx="12" fill="#EAF4FF" stroke="#76A9DF" stroke-width="2"/>
<text x="1150" y="345" font-size="30" font-weight="700" fill="#172843">Claude Code</text>
<text x="1150" y="382" font-size="21" fill="#536276"><tspan x="1150">Cloud agent · never receives</tspan><tspan x="1150" dy="28">a password</tspan></text>
</g>
<text x="1120" y="491" font-size="22" font-weight="600" fill="#6540BC"><tspan x="1120">Which databases can I use?</tspan></text>
</g>

<g class="actor" data-label="Developer" data-grade="declared">
<rect x="40" y="162" width="280" height="120" rx="12" fill="#EAF4FF" stroke="#78ABDF" stroke-width="2"/>
<circle cx="73" cy="190" r="11" fill="#153F66"/>
<path d="M 54 224 Q 54 204 73 204 Q 92 204 92 224 Z" fill="#153F66"/>
<text x="110" y="200" font-size="25" font-weight="700" fill="#142F4B">Developer</text>
<text x="60" y="244" font-size="18" fill="#526276"><tspan x="60">Enters passwords locally before chat</tspan></text>
</g>

<g class="edge" data-from="Developer" data-to="LocalMCPServer · provisioning console" data-kind="derived">
<path d="M 320 218 L 490 218 Q 510 218 510 238 L 510 416" fill="none" stroke="#2879C8" stroke-width="3" stroke-dasharray="6 5" marker-end="url(#blue)"/>
<text x="536" y="250" font-size="20" font-weight="600" fill="#2469A7" paint-order="stroke" stroke="#FFFFFF" stroke-width="6">Enter password locally</text>
</g>

<g class="edge" data-from="LocalMCPServer · provisioning console" data-to="CredentialVault" data-kind="derived">
<path d="M 460 526 L 460 558 Q 460 576 442 576 L 260 576 Q 242 576 242 594 L 242 650" fill="none" stroke="#318447" stroke-width="3" stroke-dasharray="6 5" marker-end="url(#green)"/>
<text x="69" y="558" font-size="20" font-weight="600" fill="#28743D" paint-order="stroke" stroke="#FFFFFF" stroke-width="6">Seal password locally</text>
</g>

<g class="edge" data-from="LocalMCPServer · provisioning console" data-to="ConnectionRegistry">
<path d="M 785 526 L 785 650" fill="none" stroke="#E87830" stroke-width="4" marker-end="url(#orange)"/>
<text x="800" y="585" font-size="20" fill="#C66324" paint-order="stroke" stroke="#FFFFFF" stroke-width="6">handled by</text>
</g>

<g class="edge" data-from="ConnectionRegistry" data-to="ConnectionCatalog">
<path d="M 685 780 L 685 872" fill="none" stroke="#A77923" stroke-width="3" marker-end="url(#gold)"/>
<text x="523" y="831" font-size="18" fill="#876018" paint-order="stroke" stroke="#FFFFFF" stroke-width="6">reads + writes</text>
</g>
<g class="edge" data-from="ConnectionCatalog" data-to="ConnectionRegistry">
<path d="M 888 872 L 888 780" fill="none" stroke="#A77923" stroke-width="3" marker-end="url(#gold)"/>
<text x="904" y="831" font-size="18" fill="#876018" paint-order="stroke" stroke="#FFFFFF" stroke-width="6">read by</text>
</g>

<g class="edge" data-from="Claude Code" data-to="ConnectionRegistry">
<path d="M 1165 440 L 1165 674 Q 1165 694 1145 694 L 970 694" fill="none" stroke="#6540BC" stroke-width="4" marker-end="url(#purple)"/>
<text x="1108" y="560" font-size="21" font-weight="700" fill="#6540BC" paint-order="stroke" stroke="#FFFFFF" stroke-width="6">ListConnections</text>
</g>
<g class="edge" data-from="ConnectionRegistry" data-to="Claude Code" data-kind="derived">
<path d="M 970 752 L 1360 752 Q 1380 752 1380 732 L 1380 440" fill="none" stroke="#8062C5" stroke-width="3" stroke-dasharray="6 5" marker-end="url(#purple)"/>
<text x="1300" y="602" text-anchor="middle" font-size="24" font-weight="700" fill="#5736A2" paint-order="stroke" stroke="#FFFFFF" stroke-width="6">alpha · beta</text>
<text x="1300" y="635" text-anchor="middle" font-size="17" fill="#655381" paint-order="stroke" stroke="#FFFFFF" stroke-width="6"><tspan x="1300">Aliases + non-secret metadata only</tspan></text>
</g>
</svg>
