<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" viewBox="0 0 1536 1024" font-family="Inter, 'Segoe UI', Arial, sans-serif">
<title>SQL Investigator: trust and policy boundaries</title>
<desc>Three logical trust zones separate Claude Code, local enforcement and read-only SQL Server access. All services share approval and redaction controls. Local provisioning supplies a local credential vault through inferred, dashed routes.</desc>
<defs>
<marker id="arrow" orient="auto" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="10" refY="5"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#526477"/></marker>
<marker id="blue" orient="auto" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="10" refY="5"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#0870CA"/></marker>
</defs>
<rect x="0" y="0" width="1536" height="1024" fill="#FFFFFF"/>
<text x="768" y="43" text-anchor="middle" font-size="32" font-weight="750" fill="#102344">SQL Investigator: trust and policy boundaries</text>
<text x="768" y="76" text-anchor="middle" font-size="20" fill="#233E60">Local credentials • read-only SQL Server access • production exposure requires approval</text>

<g class="service" data-label="ProductionDataApproval" data-grade="declared">
<rect x="480" y="108" width="720" height="151" rx="14" fill="#FFF0F5" stroke="#D72A67" stroke-width="2"/>
<text x="502" y="137" font-size="21" font-weight="700" fill="#9B1749">ProductionDataApproval</text>
<text x="502" y="162" font-size="15" fill="#182D49"><tspan x="502">Data owner must approve the environment and classifications before</tspan><tspan x="502" dy="20">production data reaches Claude Code</tspan></text>
<text x="502" y="211" font-size="13" fill="#55384B"><tspan x="502">ApprovedEnvironmentsOnly: refuse provisioning and queries without approval</tspan><tspan x="502" dy="22">SecretRedaction: no secrets in results, errors, diagnostics, history or knowledge</tspan></text>
</g>

<g class="domain" data-label="Cloud-agent trust zone" data-grade="declared">
<rect x="20" y="290" width="330" height="520" rx="14" fill="#EDF7FF" stroke="#6AA7E7" stroke-width="1.5"/>
<text x="40" y="323" font-size="21" font-weight="700" fill="#075FAE">Cloud-agent trust zone</text>
<text x="40" y="350" font-size="13" fill="#48617D"><tspan x="40">Conversational requests and</tspan><tspan x="40" dy="18">agent-side correlation</tspan></text>
<g class="service" data-label="Claude Code" data-grade="declared">
<rect x="40" y="470" width="145" height="190" rx="12" fill="#FFFFFF" stroke="#0870CA" stroke-width="2"/>
<rect x="88" y="490" width="48" height="32" rx="12" fill="#0870CA"/>
<circle cx="102" cy="505" r="4" fill="#FFFFFF"/><circle cx="122" cy="505" r="4" fill="#FFFFFF"/>
<text x="54" y="550" font-size="20" font-weight="700" fill="#102344">Claude Code</text>
<text x="54" y="579" font-size="14" fill="#233E60"><tspan x="54">Calls local tools;</tspan><tspan x="54" dy="20">correlates results</tspan><tspan x="54" dy="20">across databases</tspan></text>
</g>
</g>

<g class="domain" data-label="Local Windows system" data-grade="declared">
<rect x="390" y="290" width="810" height="710" rx="14" fill="#F0F7FD" stroke="#6AA7E7" stroke-width="1.5"/>
<text x="412" y="320" font-size="22" font-weight="700" fill="#153A70">Local Windows system</text>
<text x="710" y="320" font-size="14" fill="#48617D">Credentials and enforcement stay local</text>
<g class="domain" data-label="LocalMCPServer" data-grade="declared">
<rect x="410" y="342" width="460" height="493" rx="12" fill="#E6F2FC" stroke="#3785DB" stroke-width="1.5"/>
<text x="480" y="367" font-size="20" font-weight="700" fill="#153A70">LocalMCPServer</text>
<text x="660" y="367" font-size="12" fill="#233E60">Windows .NET 10 • MCP over stdio</text>
<g class="service" data-label="ConnectionRegistry" data-grade="declared">
<rect x="480" y="390" width="360" height="110" rx="10" fill="#F0FAF2" stroke="#48A458" stroke-width="1.7"/>
<text x="496" y="414" font-size="19" font-weight="700" fill="#173E32">ConnectionRegistry</text>
<text x="496" y="436" font-size="14" fill="#233E60">Lists and removes aliases; provisions locally</text>
<text x="496" y="461" font-size="13" fill="#233E60"><tspan x="496">ApprovedEnvironmentsOnly • input</tspan><tspan x="496" dy="19">SecretRedaction • output</tspan></text>
</g>
<g class="service" data-label="QueryGateway" data-grade="declared">
<rect x="480" y="535" width="360" height="170" rx="10" fill="#FFF7DF" stroke="#EEA100" stroke-width="2.3"/>
<text x="496" y="560" font-size="21" font-weight="750" fill="#69460E">QueryGateway</text>
<text x="496" y="583" font-size="14" fill="#233E60">Validates SQL and enforces execution limits</text>
<text x="496" y="608" font-size="12.5" fill="#233E60"><tspan x="496">ApprovedEnvironmentsOnly • input</tspan><tspan x="496" dy="18">SecretRedaction • output</tspan><tspan x="496" dy="18">SelectOnlyAllowlist • input: one bounded SELECT;</tspan><tspan x="496" dy="17">fail closed</tspan><tspan x="496" dy="18">QueryBudgets • action: timeout, rows, bytes,</tspan><tspan x="496" dy="17">concurrency, investigation limits</tspan></text>
</g>
<g class="service" data-label="KnowledgeService" data-grade="declared">
<rect x="480" y="725" width="360" height="100" rx="10" fill="#F3EFFF" stroke="#8260D5" stroke-width="1.7"/>
<text x="496" y="748" font-size="19" font-weight="700" fill="#403174">KnowledgeService</text>
<text x="496" y="769" font-size="13" fill="#233E60">Reads schema and maintains relationship knowledge</text>
<text x="496" y="792" font-size="12.5" fill="#233E60"><tspan x="496">ApprovedEnvironmentsOnly • input</tspan><tspan x="496" dy="18">SecretRedaction • output</tspan></text>
</g>
</g>

<g class="service" data-label="ConnectionCatalog" data-grade="declared">
<rect x="980" y="390" width="195" height="90" rx="9" fill="#FFFFFF" stroke="#73A4D4"/>
<text x="994" y="416" font-size="16" font-weight="700" fill="#153A70">ConnectionCatalog</text>
<text x="994" y="440" font-size="13" fill="#233E60"><tspan x="994">Local alias metadata;</tspan><tspan x="994" dy="18">never secrets</tspan></text>
</g>
<g class="service" data-label="InvestigationHistory" data-grade="declared">
<rect x="980" y="600" width="195" height="80" rx="9" fill="#FFFFFF" stroke="#73A4D4"/>
<text x="994" y="626" font-size="16" font-weight="700" fill="#153A70">InvestigationHistory</text>
<text x="994" y="651" font-size="13" fill="#233E60">Local investigation records</text>
</g>
<g class="service" data-label="KnowledgeStore" data-grade="declared">
<rect x="980" y="740" width="195" height="80" rx="9" fill="#FFFFFF" stroke="#73A4D4"/>
<text x="994" y="765" font-size="16" font-weight="700" fill="#153A70">KnowledgeStore</text>
<text x="994" y="787" font-size="13" fill="#233E60"><tspan x="994">Local schema and</tspan><tspan x="994" dy="18">relationship records</tspan></text>
</g>
<g class="service" data-label="CredentialVault" data-grade="declared">
<rect x="600" y="890" width="550" height="90" rx="12" fill="#DDEFFF" stroke="#1483E6" stroke-width="2"/>
<text x="620" y="918" font-size="21" font-weight="700" fill="#084B8B">CredentialVault</text>
<text x="620" y="944" font-size="14" fill="#233E60">DPAPI CurrentUser • current-user-only files • one secret per alias</text>
<text x="620" y="965" font-size="13" fill="#233E60">Local secret store; services read only</text>
</g>
</g>

<g class="domain" data-label="SQL Server boundary" data-grade="declared">
<rect x="1230" y="290" width="286" height="710" rx="14" fill="#EFF9EF" stroke="#72AA74" stroke-width="1.5"/>
<text x="1248" y="323" font-size="21" font-weight="700" fill="#215C43">SQL Server boundary</text>
<text x="1248" y="351" font-size="13" fill="#48617D">Independently authorized databases</text>
<g class="service" data-label="SQL Server" data-grade="declared">
<rect x="1260" y="540" width="230" height="180" rx="12" fill="#FFFFFF" stroke="#0870CA" stroke-width="2"/>
<ellipse cx="1375" cy="571" rx="26" ry="9" fill="#1469B1"/>
<path d="M 1349 571 L 1349 599 Q 1375 617 1401 599 L 1401 571" fill="#1469B1" stroke="#FFFFFF"/>
<text x="1375" y="640" text-anchor="middle" font-size="24" font-weight="700" fill="#102344">SQL Server</text>
<text x="1278" y="668" font-size="14" fill="#233E60"><tspan x="1278">Per-database alias and</tspan><tspan x="1278" dy="20">least-privilege read-only principal</tspan></text>
</g>
</g>

<g class="actor" data-label="Developer · local provisioning console" data-grade="declared">
<rect x="20" y="860" width="340" height="120" rx="12" fill="#EFF2F7" stroke="#73869E" stroke-width="1.5"/>
<circle cx="48" cy="889" r="10" fill="#526477"/>
<path d="M 31 923 Q 31 901 48 901 Q 65 901 65 923 Z" fill="#526477"/>
<text x="80" y="887" font-size="16" font-weight="700" fill="#233E60"><tspan x="80">Developer · local provisioning</tspan><tspan x="80" dy="22">console</tspan></text>
<text x="40" y="950" font-size="15" fill="#233E60">Enters credentials outside MCP</text>
</g>

<g fill="none" stroke-linejoin="round" stroke-linecap="round" stroke-width="1.8" stroke="#526477">
<g class="edge" data-from="Claude Code" data-to="ConnectionRegistry">
<path d="M 185 490 L 205 490 L 205 425 L 480 425" stroke="#0870CA" marker-end="url(#blue)"/>
<text x="216" y="412" fill="#233E60" stroke="#FFFFFF" stroke-width="6" paint-order="stroke" font-size="12"><tspan x="216">ListConnections · RemoveConnection</tspan></text>
</g>
<g class="edge" data-from="Claude Code" data-to="QueryGateway">
<path d="M 185 565 L 480 565" stroke="#0870CA" stroke-width="2.4" marker-end="url(#blue)"/>
<text x="204" y="528" fill="#233E60" stroke="#FFFFFF" stroke-width="6" paint-order="stroke" font-size="11"><tspan x="204">ValidateSql · ExecuteSql</tspan><tspan x="204" dy="17">StartInvestigation · RecordFinding · GetInvestigation</tspan></text>
</g>
<g class="edge" data-from="Claude Code" data-to="KnowledgeService">
<path d="M 185 640 L 205 640 L 205 751 L 480 751" stroke="#0870CA" marker-end="url(#blue)"/>
<text x="215" y="716" fill="#233E60" stroke="#FFFFFF" stroke-width="6" paint-order="stroke" font-size="12"><tspan x="215">InspectSchema · SearchKnowledge</tspan><tspan x="215" dy="18">ProposeRelationship · ReviewRelationship</tspan></text>
</g>

<g class="edge" data-from="QueryGateway" data-to="SQL Server">
<path d="M 840 550 L 880 550 L 880 520 L 1220 520 L 1220 580 L 1260 580" stroke="#D59A19" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="1010" y="510" fill="#69460E" stroke="#FFFFFF" stroke-width="6" paint-order="stroke" font-size="13">depends on + invokes</text>
</g>
<g class="edge" data-from="KnowledgeService" data-to="SQL Server">
<path d="M 840 817 L 890 817 L 890 845 L 1210 845 L 1210 690 L 1260 690" stroke="#8260D5" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="1005" y="865" fill="#5D4694" stroke="#FFFFFF" stroke-width="6" paint-order="stroke" font-size="13">depends on + invokes</text>
</g>

<g class="edge" data-from="ConnectionRegistry" data-to="ProductionDataApproval">
<path d="M 840 403 L 900 403 L 900 259" marker-end="url(#arrow)"/>
<text x="850" y="386" fill="#233E60" stroke="#FFFFFF" stroke-width="6" paint-order="stroke" font-size="12">governed by</text>
</g>
<g class="edge" data-from="QueryGateway" data-to="ProductionDataApproval">
<path d="M 840 590 L 920 590 L 920 259" marker-end="url(#arrow)"/>
<text x="846" y="578" fill="#233E60" stroke="#FFFFFF" stroke-width="6" paint-order="stroke" font-size="12">governed by</text>
</g>
<g class="edge" data-from="KnowledgeService" data-to="ProductionDataApproval">
<path d="M 840 735 L 940 735 L 940 259" marker-end="url(#arrow)"/>
<text x="846" y="721" fill="#233E60" stroke="#FFFFFF" stroke-width="6" paint-order="stroke" font-size="12">governed by</text>
</g>

<g class="edge" data-from="ConnectionRegistry" data-to="CredentialVault">
<path d="M 480 480 L 440 480 L 440 852 L 700 852 L 700 890" marker-end="url(#arrow)"/>
<text x="650" y="848" fill="#233E60" stroke="#FFFFFF" stroke-width="6" paint-order="stroke" font-size="12">reads</text>
</g>
<g class="edge" data-from="QueryGateway" data-to="CredentialVault">
<path d="M 480 690 L 450 690 L 450 866 L 790 866 L 790 890" marker-end="url(#arrow)"/>
<text x="748" y="862" fill="#233E60" stroke="#FFFFFF" stroke-width="6" paint-order="stroke" font-size="12">reads</text>
</g>
<g class="edge" data-from="KnowledgeService" data-to="CredentialVault">
<path d="M 480 810 L 460 810 L 460 880 L 880 880 L 880 890" marker-end="url(#arrow)"/>
<text x="842" y="877" fill="#233E60" stroke="#FFFFFF" stroke-width="6" paint-order="stroke" font-size="12">reads</text>
</g>

<g class="edge" data-from="ConnectionRegistry" data-to="ConnectionCatalog">
<path d="M 840 450 L 980 450" marker-end="url(#arrow)"/>
<text x="853" y="443" fill="#233E60" stroke="#FFFFFF" stroke-width="6" paint-order="stroke" font-size="12">reads + writes</text>
</g>
<g class="edge" data-from="QueryGateway" data-to="InvestigationHistory">
<path d="M 840 655 L 980 655" marker-end="url(#arrow)"/>
<text x="853" y="646" fill="#233E60" stroke="#FFFFFF" stroke-width="6" paint-order="stroke" font-size="12">reads + writes</text>
</g>
<g class="edge" data-from="KnowledgeService" data-to="KnowledgeStore">
<path d="M 840 780 L 980 780" marker-end="url(#arrow)"/>
<text x="853" y="772" fill="#233E60" stroke="#FFFFFF" stroke-width="6" paint-order="stroke" font-size="12">reads + writes</text>
</g>

<g class="edge" data-kind="derived" data-grade="inferred" data-from="Developer · local provisioning console" data-to="ConnectionRegistry">
<path d="M 360 890 L 375 890 L 375 462 L 480 462" stroke="#648BAE" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<text x="215" y="788" fill="#48617D" stroke="#FFFFFF" stroke-width="6" paint-order="stroke" font-size="12"><tspan x="215">ProvisionConnection · local console</tspan></text>
</g>
<g class="edge" data-kind="derived" data-grade="inferred" data-from="Developer · local provisioning console" data-to="CredentialVault">
<path d="M 360 940 L 600 940" stroke="#648BAE" stroke-width="1.5" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
<text x="398" y="929" fill="#48617D" stroke="#FFFFFF" stroke-width="6" paint-order="stroke" font-size="13">places secret locally</text>
</g>
</g>
</svg>
