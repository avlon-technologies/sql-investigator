# Build, test and acceptance for the SQL Investigator executable.
#
# Runs on the self-hosted Windows runner on the developer's PC (label sqlinv-local), because DPAPI CurrentUser
# and NTFS ACLs are part of what is tested and GitHub-hosted minutes are limited. The tests use the PC's local
# throwaway SQL Server container (sqlinvestigator-mssql at 127.0.0.1,1433); the fixtures read its admin password
# from %LOCALAPPDATA%\SqlInvestigator\dev-fixture\sa-password.txt, which never leaves the machine. Fixtures are
# disposable SqlInvFixture_* databases with synthetic data; nothing here can reach a real database.
name: .NET

# Self-hosted runner: NEVER trigger on pull_request. A public repository would let anyone run code from a fork PR
# on the maintainer machine. Pushes come only from people with write access.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sqlinv-local-runner
  cancel-in-progress: false

jobs:
  build-test:
    name: Build, test and acceptance
    if: github.repository == 'avlon-technologies/sql-investigator'
    runs-on: [self-hosted, Windows, X64, sqlinv-local]
    timeout-minutes: 45
    env:
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      SQLINVESTIGATOR_FIXTURE_SERVER: "127.0.0.1,1433"
      # Step scripts run as .ps1 files and the PC's policy is Restricted. Bypass applies to this job's processes only.
      PSExecutionPolicyPreference: Bypass
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v5

      - name: Check the local toolchain and test SQL Server
        run: |
          dotnet --version
          node --version
          $running = docker inspect -f '{{.State.Running}}' sqlinvestigator-mssql 2>$null
          if ($running -ne 'true') { Write-Error 'The sqlinvestigator-mssql container is not running. Start Docker Desktop and the container, then re-run.'; exit 1 }
          if (-not (Test-Path "$env:LOCALAPPDATA\SqlInvestigator\dev-fixture\sa-password.txt")) { Write-Error 'The fixture admin password file is missing.'; exit 1 }

      - name: Build (warnings are errors)
        run: dotnet build SqlInvestigator.slnx -c Release

      - name: Unit and integration tests
        run: dotnet test SqlInvestigator.slnx -c Release --no-build --logger "trx" --results-directory TestResults

      - name: Acceptance scenarios against the real executable
        env:
          SQLINVESTIGATOR_SKIP_BUILD: "1"
          SQLINVESTIGATOR_ACCEPTANCE_CONFIGURATION: "Release"
        run: node continuum/acceptance/run.mjs

      - name: Remove leftover fixtures
        if: always()
        run: tests/SqlInvestigator.FixtureTool/bin/Release/net10.0/win-x64/SqlInvestigator.FixtureTool.exe drop-all
        continue-on-error: true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: TestResults
          if-no-files-found: ignore
