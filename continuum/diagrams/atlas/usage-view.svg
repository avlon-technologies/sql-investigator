<path d="M 1030 755 L 1040 755 L 1040 820 L 1190 820" stroke="#27639A" stroke-width="2.3" marker-end="url(#arrow)"/>
<text x="1195" y="735" fill="#36536D" stroke="#FFFFFF" stroke-width="6" paint-order="stroke" font-size="14">depends on + invokes</text>
</g>
