<text x="305" y="756" fill="#286147" stroke="#FFFFFF" stroke-width="6" paint-order="stroke" font-size="15"><tspan x="305">ProvisionConnection ·</tspan><tspan x="305" dy="21">non-secret profile</tspan></text>
</g>
